[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "researchops-mvp"
version = "0.2.0"
description = "Auditable research agent for idea understanding and literature acquisition"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["certifi>=2024.2.2", "PyYAML>=6.0"]

[project.optional-dependencies]
web = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "PyJWT>=2.9,<3", "httpx>=0.27,<1", "python-dotenv>=1,<2"]
pdf = ["PyMuPDF>=1.24"]
docling = ["docling>=2.70"]
retrieval = ["sentence-transformers>=3.0", "torch>=2.2"]
datasets = ["torch>=2.2", "torchvision>=0.17", "Pillow>=10", "numpy>=1.26", "scipy>=1.11", "pyarrow>=17,<25"]
dev = ["pytest>=8"]
coding = ["timm==1.0.27", "pytest>=8"]
agent = [
    "langgraph==1.2.16",
    "langgraph-checkpoint-sqlite==3.1.2",
    "qdrant-client==1.20.0",
    "mcp==2.3.0",
]
# Compatibility alias for existing local environments and reproduction scripts.
agent-v03 = [
    "langgraph==1.2.16",
    "langgraph-checkpoint-sqlite==3.1.2",
    "qdrant-client==1.20.0",
    "mcp==2.3.0",
]
ragas-eval = [
    "ragas==0.4.3",
    "datasets==5.1.0",
    "langchain-community==0.3.31",
    "langchain-openai==1.7.2",
    "sentence-transformers==6.2.0",
]

[project.scripts]
researchops = "researchops.application.cli:main"

[tool.setuptools.packages.find]
where = ["src", "backend/src"]

[tool.setuptools.package-data]
researchops = ["coding/templates/vit_peft/*", "coding/templates/vit_peft/tests/*", "vendor/taleclaw/LICENSE"]

[tool.pytest.ini_options]
pythonpath = ["src", "backend/src"]
testpaths = ["tests"]
